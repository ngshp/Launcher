name: Build PBNG Launcher
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Extract zip"
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Get-ChildItem -Path . -Filter *.zip -File | Select-Object -First 1
          if ($zip) {
            Write-Host "Extracting $($zip.Name) ..."
            [System.IO.Compression.ZipFile]::ExtractToDirectory($zip.FullName, (Get-Location).Path, $true)
            Write-Host "Done."
          } else {
            Write-Host "No zip file found at repo root."
          }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore PBNG.sln
      - run: dotnet build PBNG.sln -c Release --no-restore
      - shell: pwsh
        run: ./build-all.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PBNG-Launcher-Windows
          path: Deploy/
