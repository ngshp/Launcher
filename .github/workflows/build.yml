name: Build PBNG Launcher
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Extract zip"
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Filter *.zip -File | Select-Object -First 1
          if ($zip) { Expand-Archive -Path $zip.FullName -DestinationPath . -Force }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore PBNG.sln
      - run: dotnet build PBNG.sln -c Release --no-restore
      - shell: pwsh
        run: ./build-all.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PBNG-Launcher-Windows
          path: Deploy/
